name: CI

# develop es la rama de integración y main la de producción (solo recibe la PR develop → main).
# test: en pull requests a develop y a main, y en push a main. publish, deploy y tag: solo en push a main.
# workflow_dispatch con `sha` ejecuta únicamente deploy (rollback o redeploy de un commit ya publicado).
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo (40 caracteres) del commit cuyas imágenes se despliegan
        required: true
        type: string

# Permisos mínimos por defecto; cada trabajo que necesite más los declara.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar la solución
        run: dotnet build Synap.slnx -v q -nologo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt

      - name: Instalar dependencias del servicio de IA
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      # Solo las pruebas sin red ni base de datos (mismos ficheros que `build` en workspace.yaml).
      - name: Pruebas del servicio de IA
        working-directory: ai-service
        run: python -m pytest -q tests/test_groq_provider.py tests/test_assistant_api.py

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar synap-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sergioizq/synap-api:${{ github.sha }}
            ghcr.io/sergioizq/synap-api:latest
          cache-from: type=gha,scope=synap-api
          cache-to: type=gha,mode=max,scope=synap-api

      - name: Publicar synap-ai
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          push: true
          tags: |
            ghcr.io/sergioizq/synap-ai:${{ github.sha }}
            ghcr.io/sergioizq/synap-ai:latest
          cache-from: type=gha,scope=synap-ai
          cache-to: type=gha,mode=max,scope=synap-ai

  deploy:
    needs: publish
    # Los trabajos anteriores se omiten en workflow_dispatch; !cancelled() deja que este corra igualmente.
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.publish.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    environment: production
    # Un despliegue cada vez y sin cancelar el que está en curso.
    concurrency:
      group: deploy-production-back
      cancel-in-progress: false
    steps:
      - name: Resolver el SHA a desplegar
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          sha="$PUSH_SHA"
          [ "$EVENT" = workflow_dispatch ] && sha="$INPUT_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::El SHA debe tener 40 caracteres hexadecimales en minúscula"
            exit 1
          fi
          echo "value=$sha" >> "$GITHUB_OUTPUT"

      # La clave de CI solo puede ejecutar scripts/deploy.sh en el VPS (command= en authorized_keys).
      # VPS_HOST_KEY es la línea de known_hosts del servidor (salida de `ssh-keyscan -t ed25519 <host>`).
      - name: Desplegar synap-api y synap-ai
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy)
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "synap-api synap-ai $SHA"

  # Versión de producción: solo tras un deploy correcto de un push a main (nunca en workflow_dispatch).
  tag:
    needs: deploy
    if: ${{ !cancelled() && github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial y tags completos para calcular la versión

      # vMAJOR.MINOR.PATCH: sube el patch del mayor tag existente (v1.0.0 si no hay ninguno).
      # Minor y major se suben creando el tag a mano; la siguiente versión parte de él.
      - name: Crear el tag de versión
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          for intento in 1 2 3; do
            actual=$(git tag --points-at "$GITHUB_SHA" | grep -E "$semver" | head -1 || true)
            if [ -n "$actual" ]; then
              echo "El commit ya tiene la versión $actual; no se crea otra."
              exit 0
            fi
            ultima=$(git tag -l 'v*' --sort=-v:refname | grep -E "$semver" | head -1 || true)
            if [ -z "$ultima" ]; then
              version=v1.0.0
            else
              IFS=. read -r mayor menor parche <<< "${ultima#v}"
              version="v$mayor.$menor.$((parche + 1))"
            fi
            git tag -a "$version" "$GITHUB_SHA" -m "$version ($GITHUB_WORKFLOW, $GITHUB_SHA)"
            if git push origin "refs/tags/$version"; then
              echo "Creada la versión $version."
              exit 0
            fi
            # Otra ejecución publicó esa versión antes: se recalcula con los tags del remoto.
            echo "::warning::$version ya existe en el remoto; se recalcula (intento $intento)."
            git tag -d "$version"
            git fetch --tags --force origin
          done
          echo "::error::No se pudo crear la versión tras 3 intentos."
          exit 1
